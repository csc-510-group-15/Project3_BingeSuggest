<!DOCTYPE html>
<html>
  <head>
    <!-- Same head content as watchlist.html -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='stylesheet.css') }}">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>BingeSuggest - Wishlist</title>
    <link rel="icon" href="{{ url_for('static', filename='Popcorn-icon.png') }}" />
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js" crossorigin="anonymous"></script>
    <!-- Load wishlist-specific JS instead of watchlist.js -->
    <script src="{{ url_for('static', filename='wishlist.js') }}"></script>

    <style>
      #addWishlistButton {
          height: 35px;
          padding: 0 10px;
          margin-top: 7%;
      }

      #searchBoxWishlist {
          border-radius: 30px;
          margin-top: 3%;
          width: 100%;
      }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}

    <div class="container" style="margin-top: 60px;">
        <div class="heading1">
          <h2 style="margin-top:60px"><center>My Wishlist</center></h2>
          
          <div class="container" style="margin:50px 0px">
            <div class="row"> 
              <div class="col-md-10">
                <!-- Changed ID to wishlist-specific names -->
                <input class="form-control mr-sm-2" type="search" placeholder="Search for a Movie" aria-label="Search" id="searchBoxWishlist" style="border-radius: 30px;width:100%; margin:auto;margin-top:3%;" />
                <input type="hidden" id="imdbID" />
                <input type="hidden" id="movieName" />
              </div>
              <div class="col-md-2 mt-1">
                <!-- Changed ID to wishlist-specific names -->
                <button id="addWishlistButton" class="btn btn-warning" type="button">Add</button>
              </div>
            </div>
          </div>
        </div>
    </div>

    <!-- Container for wishlist items -->
    <div id="wishlist-container" style="margin: auto; max-width: 1100px; height: 95%; overflow-y:auto; background-color: white;">
      <!-- Wishlist items will be loaded here  -->
    </div>

    <div class="d-none" id="loaderLanding">
        <div class="spinner-border" role="status">
          <span class="sr-only"></span>
        </div>
    </div>
  </body>
</html>
