    rel="stylesheet">
<head>
  <style>
    .circle {
        width: 260px;
        height: 260px;
        border-radius: 20%;
        background-color: whitesmoke;
        display: flex;
        justify-content: center;
        align-items: center;
        color: black;
        text-decoration: none;
        font-size: 1.3rem;
        transition: transform 0.3s ease;
        margin: 10px auto;
        padding: 0%;
      }
      .circle:hover {
        transform: scale(1.1);
      }
      .coustard-regular {
        font-family: "Coustard", serif;
        font-weight: 400;
      }
      .righteous-regular {
        font-family: "Righteous", sans-serif;
        font-size: 50px;
      }
  </style>
</head>

<body>
  {% include 'navbar.html' %}
  <div class="container" style="margin-top: 60px;" id="centralDivLanding">
    <div class="heading1">
      <br><br><br><br>
      <h1 class="righteous-regular"><center>🎬 BingeSuggest🍿🎬</center></h1>
      <h2 class="coustard-regular"><center>Play a Game!</center></h2>
    </div>
    <!-- Circle Buttons Row -->
    <div class="row btn-row text-center" style="padding-right:20%; padding-left: 20%;">
        <a class="circle" href="/games/quiz">
            <table>
                <tr>
                    <td>
                        <img src="/static/question_bubbles.png" style="scale: 1.5; width: 75%; height: 75%"></img>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>Trivia Quiz</p>
                    </td>
                </tr>
            </table>
        </a>
        <a class="circle" href="/games/higher_or_lower">
            <table>
                <tr>
                    <td>
                        <img src="/static/up_and_down.png" style="width: 75%; height: 75%"></img>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>Higher or Lower</p>
                    </td>
                </tr>
            </table>
        </a>
    </div>
    <div class="highlighted-section text-center mt-4">
      <p>Made with ❤️ by <a href="https://github.com/svd-ncsu/BingeSuggest" target="_blank">BingeSuggest</a></p>
      <a href="https://github.com/svd-ncsu/BingeSuggest/blob/master/LICENSE.md" target="_blank">MIT License &copy; 2024 BingeSuggest</a>
    </div>
  </div>
</body>
<script>
    function goToQuiz() {
        quiz_page();
    }

    function goToHigherOrLower() {
        return;
    }
</script>
