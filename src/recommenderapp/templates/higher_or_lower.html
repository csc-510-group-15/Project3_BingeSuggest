<!DOCTYPE html>
<html>


<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='stylesheet.css') }}">
  <title>BingeSuggest</title>
  <link rel="icon" href="{{ url_for('static', filename='Popcorn-icon.png') }}" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="{{ url_for('static', filename='higher_or_lower.js') }}"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Coustard:wght@400;900&family=Londrina+Shadow&family=Righteous&family=Ultra&display=swap"
    rel="stylesheet">
<head>
  
  <style>
    .table-row {
      margin-left: auto;
      margin-right: auto;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: whitesmoke;
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
      text-decoration: none;
      font-size: 1.3rem;
      transition: transform 0.3s ease;
      margin: 10px auto;
      font-family: "Coustard", sans-serif;
      font-size: 40px;
    }

    .correct-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: green;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-decoration: none;
      font-size: 1.3rem;
      transition: transform 0.3s ease;
      margin: 10px auto;
      font-family: "Coustard", sans-serif;
      font-size: 40px;
    }

    .incorrect-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: red;
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
      text-decoration: none;
      font-size: 1.3rem;
      transition: transform 0.3s ease;
      margin: 10px auto;
      font-family: "Coustard", sans-serif;
      font-size: 40px;
    }

    .input-btn {
      transform: scale(1.0);
    }

    .input-btn:hover {
        transform: scale(1.1);
    }
    
    .coustard-regular {
      font-family: "Coustard", serif;
      font-weight: 400;
    }

    .righteous-regular {
      font-family: "Righteous", sans-serif;
      font-size: 50px;
    }

    .heading1 {
      text-align: center;
      color: azure;
    }

    .btn-row {
      margin-top: 30px;
    }

    .listItem {
      background-color: white;
      border-radius: 8px;
      /* Rounded corners */
      padding: 15px;
      /* Padding inside the tile */
      margin-bottom: 10px;
      /* Spacing between tiles */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      /* Optional shadow for a lifted effect */
      color: black;
      font-size: 18px;
      align-content: center;
    }
  </style>
</head>

<body>
  {% include 'navbar.html' %}
  <div style="padding-bottom: 80px;"></div>
  <table width="75%">
    <!-- Main Row -->
    <tr></tr>
    <tr>
      <td width="20%" style="text-align: center;">
        <img id="secret_poster"></img>
      </td>
      <!-- Secret Movie Score (& buttons) -->
      <td width="1%" style="text-align: center;">
        <table>
          <tr>
            <td>
              <button id="higher_btn" onclick="onClickHigher()" onmouseenter="onHoverHigher()" onmouseleave="onHoverLeave()" class="input-btn btn btn-primary mx-auto">HIGHER</button>
            </td>
          </tr>
          <tr>
            <td>
              <span id="secret_score" class="score-circle"></span>
            </td>
          </tr>
          <tr>
            <td>
              <button id="lower_btn" onclick="onClickLower()" onmouseenter="onHoverLower()" onmouseleave="onHoverLeave()" class="input-btn btn btn-primary mx-auto">LOWER</button>
            </td>
          </tr>
        </table>
      </td>
      <!-- VS Label -->
      <td width="5%" style="text-align: center;">
        <span class="righteous-regular" style="color: red;">V.S.</span>
      </td>
      <!-- Revealed Movie Score -->
      <td width="1%" style="text-align: center;">
        <span id="revealed_score" class="score-circle"></span>
      </td>
      <td width="20%" style="text-align: center;">
        <img id="revealed_poster"></img>
      </td>
    </tr>
  </table>
  <table>
    <tr>
      <p class="coustard-regular" style="font-size: 30px"><span style="color: lightcoral" id="blurb_secret">_____</span>'s score is <span id="blurb_qualifier" style="color:gold">_______</span> than <span id="blurb_revealed" style="color: cornflowerblue">_____</span>'s score</p>
    </tr>
  </table>
  <table>
    <!-- Score Row -->
    <tr>
      <td width="33%">
        <p class="righteous-regular" style="text-align: center;">Score: <span id="score_num">0</span></p>
      </td>
      <td width="33%">
      </td>
      <td width="33%">
        <p class="righteous-regular" style="text-align: center;">Best: <span id="best_score_num">0</span></p>
      </td>
    </tr>
  </table>
</body>
<script>
  var buttonsActive = true;
  var revealed;
  var secret;
  var secretID;
  var score = 0;
  var best_score = 0;

  window.onload = function () {
    getRandomMovie(true);
    getRandomMovie(false);
  }

  function getRandomMovie(isRevealed = true){
      $.ajax({
      type: 'GET',
      url: '/getRandomMovie',
      contentType: "application/json;charset=UTF-8",
      success: function(response) {
        if (isRevealed) {
          setRevealed(response);
        }
        else {
          setSecret(response);
        }
      },
      error: function(error) {
        reject(error);
      }
      });
    }

  async function setRevealed(idData) {
    movieData = await fetchMovieData(idData["imdbID"]);
    // document.getElementById("revealed_title").textContent = movieData.Title;
    document.getElementById("revealed_score").textContent = movieData.imdbRating + "/10";
    document.getElementById("revealed_poster").src = movieData.Poster;
    document.getElementById("blurb_revealed").textContent = movieData.Title;
    revealed = movieData;
  }

  async function setSecret(idData){
    movieData = await fetchMovieData(idData["imdbID"]);
    // document.getElementById("secret_title").textContent = movieData.Title;
    document.getElementById("secret_score").textContent = "???/10";
    document.getElementById("secret_poster").src = movieData.Poster;
    document.getElementById("blurb_secret").textContent = movieData.Title;
    secret = movieData;
    secretID = idData;
  }

  function onHoverLower() {
    document.getElementById("blurb_qualifier").textContent = "LOWER";
  }

  function onClickLower() {
    if (revealed == null || secret == null || !buttonsActive) {
      return;
    }
    if (secret.imdbRating <= revealed.imdbRating) {
      correctAnswer();
      return;
    }
    incorrectAnswer();
  }

  function onHoverHigher() {
    document.getElementById("blurb_qualifier").textContent = "HIGHER";
  }

  function onClickHigher() {
    if (revealed == null || secret == null || !buttonsActive) {
      return;
    }
    if (secret.imdbRating >= revealed.imdbRating) {
      correctAnswer();
      return;
    }
    incorrectAnswer();
  }

  function onHoverLeave() {
    document.getElementById("blurb_qualifier").textContent = "_______";
  }

  function correctAnswer() {
    score_bubble = document.getElementById("secret_score");
    score_bubble.textContent = secret.imdbRating.toString() + "/10";
    score_bubble.setAttribute("class", "correct-circle");
    buttonsActive = false;
    setTimeout(nextChallenger, 1000);
    incrementScore();
  }

  function incorrectAnswer() {
    score_bubble = document.getElementById("secret_score");
    score_bubble.textContent = secret.imdbRating.toString() + "/10";
    score_bubble.setAttribute("class", "incorrect-circle");
    buttonsActive = false;
    setTimeout(nextChallenger, 1000);
    incrementScore(-score);
  }

  function nextChallenger() {
    buttonsActive = true;
    revealed = secret;
    secret = null;
    score_bubble = document.getElementById("secret_score");
    score_bubble.setAttribute("class", "score-circle");
    setRevealed(secretID);
    secret = null;
    secretID = null;
    getRandomMovie(false);
  }

  function incrementScore(delta = 1) {
    score = score + delta;
    if (score > best_score) {
      best_score = score;
      document.getElementById("best_score_num").textContent = best_score.toString();
    }
    document.getElementById("score_num").textContent = score.toString();
  }

</script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</html>
