<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='stylesheet.css') }}">
    <title>BingeSuggest</title>
    <link rel="icon" href="{{ url_for('static', filename='Popcorn-icon.png') }}" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Coustard:wght@400;900&family=Londrina+Shadow&family=Righteous&family=Ultra&display=swap" rel="stylesheet">
    <style>
      .table-row {
        margin-left: auto;
        margin-right: auto;
      }
      .circle {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background-color: whitesmoke;
        display: flex;
        justify-content: center;
        align-items: center;
        color: black;
        text-decoration: none;
        font-size: 1.3rem;
        transition: transform 0.3s ease;
        margin: 10px auto;
      }
      .circle:hover {
        transform: scale(1.1);
      }
      .coustard-regular {
        font-family: "Coustard", serif;
        font-weight: 400;
      }
      .righteous-regular {
        font-family: "Righteous", sans-serif;
        font-size: 50px;
      }
      .heading1 {
        text-align: center;
        color: azure;
      }
      .btn-row {
        margin-top: 30px;
      }
      .listItem {
        background-color: white; 
        border-radius: 8px; /* Rounded corners */
        padding: 15px; /* Padding inside the tile */
        margin-bottom: 10px; /* Spacing between tiles */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Optional shadow for a lifted effect */
        color:black;
        font-size: 18px;
        align-content: center;
      }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}
    
    <table width="75%">
        <!-- Main Row -->
        <tr><td><table width="100%" class="table-row"><tr>
            <!-- Revealed Movie Poster -->
            <td width="20%" style="background-color: red; text-align: left;">
                <span id="revealed_poster">Poster</span>
            </td>
            <!-- Revealed Movie Score -->
            <td width="20%" style="background-color: green; text-align: left;">
                <span id="revealed_score">Score</span>
            </td>
            <!-- VS Label -->
            <td width="20%" style="background-color: blue; text-align: left;">
                <span>VS</span>
            </td>
            <!-- Secret Movie  -->
            <td width="20%" style="background-color: yellow; text-align: left;">
                <span id="secret_score">Score</span>
            </td>
            <!-- Secret Movie Poster -->
            <td width="20%" style="background-color: purple; text-align: left;">
                <span id="secret_poster">Poster</span>
            </td>
        </tr></table></td></tr>
        
        <!-- Titles Row -->
        <tr><td><table width="100%" class="table-row"><tr>
            <!-- Revealed Movie Title -->
            <td id="revealed_title" text-align="left" width="50%" style="background-color:lightgray;">
                Left
            </td>
            <td id="secret_title" text-align="right" width="50%" style="background-color:darkgray;">
                LeftLeftLeftLeftLeftLeftLeft
            </td>
        </tr></table></td></tr>
        
        <!-- Score Row -->
        <tr>
            <td>Howdy</td>
        </tr>
    </table>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
